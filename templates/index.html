<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostgreSQL Firewall Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        input[type="password"] {
            font-family: 'Courier New', monospace;
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .status-success {
            background: #10b981;
            color: white;
        }
        
        .status-blocked {
            background: #ef4444;
            color: white;
        }
        
        .status-partial {
            background: #f59e0b;
            color: white;
        }
        
        .status-error {
            background: #6b7280;
            color: white;
        }
        
        .status-loading {
            background: #3b82f6;
            color: white;
        }
        
        .test-results {
            margin-top: 30px;
        }
        
        .test-item {
            background: #f9fafb;
            border-left: 4px solid #e5e7eb;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        
        .test-item.success {
            border-left-color: #10b981;
            background: #ecfdf5;
        }
        
        .test-item.blocked {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        
        .test-item.error {
            border-left-color: #f59e0b;
            background: #fffbeb;
        }
        
        .test-item.skipped {
            border-left-color: #9ca3af;
            background: #f3f4f6;
        }
        
        .test-name {
            font-weight: 600;
            color: #111;
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .test-message {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .test-duration {
            color: #999;
            font-size: 12px;
            font-style: italic;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .timestamp {
            color: #999;
            font-size: 12px;
            margin-top: 20px;
            text-align: center;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 PostgreSQL Firewall Test</h1>
        <p class="subtitle">Test connectivity to PostgreSQL database</p>
        
        <form id="connection-form" onsubmit="event.preventDefault(); runTest();">
            <div class="form-group">
                <label for="host">Host *</label>
                <input type="text" id="host" name="host" value="{{ default_host }}" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="port">Port *</label>
                    <input type="number" id="port" name="port" value="{{ default_port }}" required>
                </div>
                
                <div class="form-group">
                    <label for="database">Database</label>
                    <input type="text" id="database" name="database" value="{{ default_database }}">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="user">User *</label>
                    <input type="text" id="user" name="user" value="{{ default_user }}" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password">
                </div>
            </div>
            
            <button type="submit" id="test-btn">Test Connection</button>
        </form>
        
        <div id="error-container"></div>
        
        <div id="status-container">
            <div class="status-badge status-loading" id="status-badge" style="display: none;">
                <span class="loading-spinner"></span>
                Testing connection...
            </div>
        </div>
        
        <div class="test-results" id="test-results"></div>
        
        <div class="timestamp" id="timestamp"></div>
    </div>
    
    <script>
        function runTest() {
            const btn = document.getElementById('test-btn');
            const statusBadge = document.getElementById('status-badge');
            const testResults = document.getElementById('test-results');
            const timestamp = document.getElementById('timestamp');
            const errorContainer = document.getElementById('error-container');
            
            // Get form values
            const host = document.getElementById('host').value.trim();
            const port = document.getElementById('port').value.trim();
            const database = document.getElementById('database').value.trim();
            const user = document.getElementById('user').value.trim();
            const password = document.getElementById('password').value;
            
            // Validate required fields
            if (!host || !port || !user) {
                errorContainer.innerHTML = '<div class="error-message">Please fill in all required fields (Host, Port, User)</div>';
                return;
            }
            
            // Clear previous errors
            errorContainer.innerHTML = '';
            
            btn.disabled = true;
            statusBadge.style.display = 'inline-block';
            statusBadge.className = 'status-badge status-loading';
            statusBadge.innerHTML = '<span class="loading-spinner"></span> Testing connection...';
            testResults.innerHTML = '';
            timestamp.textContent = '';
            
            // Prepare request data
            const requestData = {
                host: host,
                port: parseInt(port),
                database: database || 'defaultdb',
                user: user,
                password: password
            };
            
            fetch('/api/check', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => Promise.reject(err));
                    }
                    return response.json();
                })
                .then(data => {
                    btn.disabled = false;
                    statusBadge.style.display = 'inline-block';
                    
                    // Update status badge
                    statusBadge.className = `status-badge status-${data.overall_status}`;
                    statusBadge.textContent = getStatusText(data.overall_status);
                    
                    // Display test results
                    testResults.innerHTML = '';
                    data.tests.forEach(test => {
                        const testDiv = document.createElement('div');
                        testDiv.className = `test-item ${test.status}`;
                        
                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'test-name';
                        nameDiv.textContent = test.name;
                        
                        const messageDiv = document.createElement('div');
                        messageDiv.className = 'test-message';
                        messageDiv.textContent = test.message;
                        
                        const durationDiv = document.createElement('div');
                        durationDiv.className = 'test-duration';
                        if (test.duration_ms > 0) {
                            durationDiv.textContent = `Duration: ${test.duration_ms}ms`;
                        }
                        
                        testDiv.appendChild(nameDiv);
                        testDiv.appendChild(messageDiv);
                        if (test.duration_ms > 0) {
                            testDiv.appendChild(durationDiv);
                        }
                        
                        testResults.appendChild(testDiv);
                    });
                    
                    timestamp.textContent = `Last checked: ${new Date(data.timestamp).toLocaleString()}`;
                })
                .catch(error => {
                    btn.disabled = false;
                    statusBadge.style.display = 'inline-block';
                    statusBadge.className = 'status-badge status-error';
                    statusBadge.textContent = 'Error';
                    
                    const errorMsg = error.error || error.message || 'Unknown error occurred';
                    errorContainer.innerHTML = `<div class="error-message">${errorMsg}</div>`;
                    
                    testResults.innerHTML = `
                        <div class="test-item error">
                            <div class="test-name">Connection Test Failed</div>
                            <div class="test-message">${errorMsg}</div>
                        </div>
                    `;
                });
        }
        
        function getStatusText(status) {
            const statusMap = {
                'success': '✅ Connection Successful',
                'blocked': '🚫 Blocked by Firewall',
                'partial': '⚠️ Partial Connection',
                'error': '❌ Error'
            };
            return statusMap[status] || 'Unknown';
        }
    </script>
</body>
</html>
